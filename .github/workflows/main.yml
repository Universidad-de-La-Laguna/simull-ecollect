name: Publicar

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      AWS_S3_BUCKET_NAME: ull-simull-ecollect
      AWS_ACCESS_KEY_ID: AKIA6QTMGMCNKUSQ4F5G
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_CRYPTO_KEY: ${{ secrets.CRYPTO_KEY }}

    steps:

    - name: Checkout
      uses: actions/checkout@v2
      with:
        submodules: true
        persist-credentials: false

    - name: Restore artifacts, or setup vcpkg for building artifacts
      uses: lukka/run-vcpkg@v10
      with:
        vcpkgDirectory: ${{ env.VCPKG_INSTALLATION_ROOT }}
        vcpkgGitCommitId: "5ddd7f02689b7c5aab78711d77f61db5d2e5e79c"  # 2021.12.01

    - name: Build 
      uses: lukka/run-cmake@v10
      with:
        configurePreset: 'ninja-vcpkg'
        buildPreset: 'ninja-vcpkg'

    - name: Upload binaries to artifacts
      uses: actions/upload-artifact@v2
      with:
        name: build
        path: build/ecollect.exe

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        file: build/ecollect.exe
        prerelease: true
        token: ${{ secrets.GITHUB_TOKEN }}
